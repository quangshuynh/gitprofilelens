name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node.js 24
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run unit, API, and browser tests
        run: npm test

      # Prints how corpus scoring outcomes moved against evaluation/baseline.json.
      # Informational only: the report exits 0 whether or not outcomes changed, so
      # deliberate scoring changes are reviewed in the log rather than blocked here.
      - name: Report scoring evaluation diff
        # Runs even when the tests fail, because a scoring change that breaks a
        # test is exactly when the corpus diff explains what moved.
        if: always()
        run: npm run eval
